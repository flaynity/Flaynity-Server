apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: flaynity-ffmpeg
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 3600
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/flaynity/flaynity-ffmpeg:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "4"
              memory: "8Gi"
          env:
            - name: MEDIA_BUCKET_NAME
              value: "flaynity-storage"
            - name: R2_ACCOUNT_ID
              value: "b3741135bd1f3e96b6744f11e6a06600"
            - name: PORT
              value: "8080"
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: R2_ACCESS_KEY_ID
                  key: latest
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: R2_SECRET_ACCESS_KEY
                  key: latest
            - name: FFMPEG_PROCESSOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: FFMPEG_PROCESSOR_TOKEN
                  key: latest

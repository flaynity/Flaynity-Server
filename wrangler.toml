name = "flaynity-server"
main = "index.js"
compatibility_date = "2026-09-09"
workers_dev = true

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "flaynity-storage"

[vars]
APP_ORIGIN = "https://flaynity.indevs.in"
FIREBASE_PROJECT_ID = "flaynity-app"
R2_ACCOUNT_ID = "b3741135bd1f3e96b6744f11e6a06600"
MEDIA_BUCKET_NAME = "flaynity-storage"
# The server itself now serves the public /media route, avoiding a stale
# separate CDN Worker causing "Not found" after a successful upload.
MEDIA_BASE_URL = "https://api.flaynity.indevs.in/media"

# Modal GPU transcoding endpoints
GPU_CREATE_JOB_URL = "https://flaynity--flaynity-gpu-server-create-job.modal.run"
GPU_JOB_STATUS_URL = "https://flaynity--flaynity-gpu-server-job-status.modal.run"

name = "flaynity-server"
main = "index.js"
compatibility_date = "2026-09-09"
workers_dev = true


# IMPORTANT: Use the existing Flaynity R2 bucket.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "flaynity-storage"

[vars]
APP_ORIGIN = "https://flaynity.indevs.in"
FIREBASE_PROJECT_ID = "flaynity-app"
R2_ACCOUNT_ID = "b3741135bd1f3e96b6744f11e6a06600"
MEDIA_BUCKET_NAME = "flaynity-storage"
MEDIA_BASE_URL = "https://cdn.flaynity.indevs.in/media"
# Public base URL of the GPU transcoder. Set this to the reachable HTTPS URL of Flaynity-GPU-Transcoder.
GPU_TRANSCODER_URL = "https://usage-coffee-moss-relative.trycloudflare.com"
